version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: intentos
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: intentos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentos"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=intentos
      - DB_PASSWORD=secret
      - DB_NAME=intentos
      - JWT_SECRET=supersecret
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
