services:
  - type: web
    name: intentos-backend
    env: go
    rootDir: backend
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intentos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: intentos-db
    databaseName: intentos
    user: intentos
    plan: free
